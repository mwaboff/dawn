@if (loading()) {
  <p class="run-environment-panel__status">Loading environment…</p>
} @else if (failed()) {
  <p class="run-environment-panel__status" role="alert">
    Couldn't load the environment.
    <button type="button" class="run-environment-panel__retry-link" (click)="retry()">Retry</button>
  </p>
} @else if (card(); as env) {
  <app-run-stat-row
    [expanded]="isExpanded()"
    [detailId]="detailId()"
    [variant]="'environment'"
    [density]="density()"
    (toggled)="toggleExpanded()"
  >
    <span row-identity class="stat-row__name-line">
      <span class="stat-row__name">{{ env.name }}</span>
    </span>
    @if (env.subtitle) {
      <span row-secondary class="stat-row__secondary">{{ env.subtitle }}</span>
    }
    <ng-container row-vitals>
      @if (difficultyLabel(); as difficulty) {
        <span class="stat-row__vital">
          <b>{{ difficulty }}</b><small>Difficulty</small>
        </span>
      }
    </ng-container>
    <app-run-environment-detail row-detail [card]="env" [impulses]="impulses()" [potentialAdversaries]="potentialAdversaries()" />
  </app-run-stat-row>
}
