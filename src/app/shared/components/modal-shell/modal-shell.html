<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events -- appModalFocus provides the keyboard equivalent (Escape via its `escape` output, Tab trapped to the dialog); clicking the backdrop is a pointer-only convenience on top of that. -->
<div
  class="dialog-backdrop"
  (click)="onBackdropClick($event)"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  appModalFocus
  (escape)="onEscape()"
>
  <div class="dialog-panel">
    <h2 class="dialog-title" [id]="titleId">{{ title() }}</h2>
    <ng-content select="[modal-body]" />
    <div class="dialog-actions">
      <ng-content select="[modal-actions]" />
    </div>
  </div>
</div>
