@if (canCustomize()) {
  <div class="customize-action">
    <button
      type="button"
      class="btn btn--secondary btn--sm"
      [disabled]="copying()"
      [attr.aria-label]="'Customize ' + result().name"
      (click)="onCustomize()"
    >
      {{ copying() ? 'Copying…' : 'Customize this item' }}
    </button>
    @if (copyFailed()) {
      <p class="customize-action-error" role="alert">Couldn't copy {{ result().name }} — try again.</p>
    }
  </div>
}
