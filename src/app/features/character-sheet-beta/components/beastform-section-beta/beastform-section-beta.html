<app-collapsible-card-group heading="Beastforms" accent="beastform" sectionId="beastforms">
  <div class="card-group__list">
    <div class="expandable-card expandable-card--beastform">
      <button type="button" class="expandable-card__header" (click)="toggleSection()"
              [attr.aria-expanded]="expanded()"
              [attr.aria-controls]="bodyId">
        <span class="expandable-card__chevron" [class.expandable-card__chevron--open]="expanded()" aria-hidden="true">&#9654;</span>
        <h4 class="expandable-card__name">Beastform Options</h4>
        <div class="expandable-card__meta">
          @if (availableCount() > 0) {
            <span class="expandable-card__meta-badge expandable-card__meta-badge--beastform">{{ availableCount() }} available</span>
          }
        </div>
      </button>

      @if (expanded()) {
        <div class="expandable-card__body" [id]="bodyId">
          @if (loading()) {
            <p class="beastform__status">Loading beastforms...</p>
          }

          @if (loadError()) {
            <p class="beastform__status beastform__status--error">
              Failed to load beastforms.
              <button type="button" class="beastform__retry" (click)="loadForms()">Retry</button>
            </p>
          }

          @if (isEmpty() && !loadError()) {
            <p class="beastform__status">No beastform options available at your tier.</p>
          }

          @if (beastformCards().length > 0) {
            <div class="beastform-grid">
              @for (entry of beastformCards(); track entry.formId) {
                <app-entity-card
                  [card]="entry.card"
                  [size]="isFormExpanded(entry.formId) ? 'expanded' : 'normal'"
                  [headingLevel]="5"
                  (sizeChange)="toggleForm(entry.formId)"
                />
              }
            </div>
          }
        </div>
      }
    </div>
  </div>
</app-collapsible-card-group>
