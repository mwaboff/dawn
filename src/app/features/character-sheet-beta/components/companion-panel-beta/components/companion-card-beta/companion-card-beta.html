<span class="sr-only" role="status">{{ outOfSceneAnnouncement() }}</span>

<app-entity-card [card]="cardData()">
  <div card-controls class="companion-card-beta__controls">
    <app-resource-tracker
      [max]="companion().stressMax"
      [marked]="companion().stressMarked"
      variant="stress"
      label="Stress"
      [idPrefix]="'companion-' + companion().id + '-stress'"
      [readonly]="!canManage()"
      (markedChange)="onStressMarkedChange($event)"
    />

    @if (pendingStressValue() !== null) {
      <div class="armor-instead-prompt">
        <span class="armor-instead-prompt__text">Mark {{ companion().name }}'s Stress, or mark an Armor Slot instead?</span>
        <button type="button" class="armor-instead-prompt__btn" (click)="confirmMarkStress()">Mark Stress</button>
        <button type="button" class="armor-instead-prompt__btn"
                [disabled]="armorInsteadDisabled()"
                [attr.aria-label]="armorInsteadDisabled() ? armorInsteadUnavailableReason() : null"
                [attr.title]="armorInsteadDisabled() ? armorInsteadUnavailableReason() : null"
                (click)="confirmMarkArmorInstead()">Mark Armor Instead</button>
        <button type="button" class="armor-instead-prompt__cancel" (click)="cancelPendingStress()">Cancel</button>
      </div>
    }
  </div>

  @if (canManage()) {
    <div card-actions class="companion-card-beta__actions">
      <button
        type="button"
        class="card-swap-btn card-swap-btn--icon"
        [disabled]="processing()"
        [attr.aria-label]="'Edit ' + companion().name"
        [attr.title]="'Edit ' + companion().name"
        (click)="onEditClicked()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
        </svg>
      </button>
      <app-inline-delete-confirm
        size="sm"
        [itemLabel]="companion().name"
        [active]="deleteConfirmActive()"
        (requested)="onDeleteRequested()"
        (confirmed)="onDeleteConfirmed()"
        (cancelled)="onDeleteCancelled()"
      />
    </div>
  }
</app-entity-card>
