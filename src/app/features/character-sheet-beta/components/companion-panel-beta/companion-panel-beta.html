<app-collapsible-card-group heading="Companions" accent="companion" sectionId="companions">
  @if (saving()) { <app-saving-spinner group-header-extra /> }

  @if (errorMessage()) {
    <p class="companion-panel-error" role="alert">
      {{ errorMessage() }}
      <button type="button" class="companion-panel-error__dismiss" (click)="onDismissError()">Dismiss</button>
    </p>
  }

  @if (companions().length === 0) {
    <p class="empty-state">No companions yet.</p>
  } @else {
    <div class="entity-card-grid entity-card-grid--2col">
      @for (companion of companions(); track companion.id) {
        <app-companion-card-beta
          [companion]="companion"
          [proficiency]="proficiency()"
          [canManage]="canManage()"
          [processing]="saving()"
          [armorAvailable]="armorAvailable()"
          [armorInsteadUnavailableReason]="armorInsteadUnavailableReason()"
          [classFeatureReminders]="classFeatureReminders()"
          (editRequested)="openEditModal(companion)"
          (deleteConfirmed)="onDelete(companion.id)"
          (stressChanged)="onStressChanged(companion.id, $event)"
          (markArmorInstead)="onMarkArmorInstead()"
        />
      }
    </div>
  }

  @if (canCreate()) {
    <button type="button" class="companion-add-btn" [disabled]="saving()" (click)="openCreateModal()">
      + Add Companion
    </button>
  }
</app-collapsible-card-group>

@if (modalMode(); as mode) {
  <app-companion-form-modal
    [mode]="mode"
    [characterSheetId]="characterSheetId()"
    [companion]="editingCompanion()"
    [processing]="saving()"
    (dismissed)="closeModal()"
    (created)="onCreated($event)"
    (updated)="onUpdated($event)"
  />
}
