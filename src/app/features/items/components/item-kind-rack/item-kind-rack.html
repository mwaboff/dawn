<!-- One glyph definition, rendered by both the picker and the locked chip. -->
<ng-template #glyph let-glyphKind>
  <svg class="kind-rack__glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    @switch (glyphKind) {
      @case ('weapon') {
        <path d="M12 2l3 4.5V15H9V6.5z" />
        <path d="M6.5 15h11" />
        <path d="M12 15v6" />
        <path d="M10 19.5h4" />
      }
      @case ('armor') {
        <path d="M12 2.5l7.5 3v5.2c0 4.6-3.1 8.2-7.5 10.3-4.4-2.1-7.5-5.7-7.5-10.3V5.5z" />
        <path d="M12 7.5v7" />
      }
      @case ('loot') {
        <path d="M8.5 7.5h7l2.8 5.4A5.9 5.9 0 0 1 12 21a5.9 5.9 0 0 1-6.3-8.1z" />
        <path d="M9.5 7.5c0-2.2 1.1-3.8 2.5-3.8s2.5 1.6 2.5 3.8" />
      }
    }
  </svg>
</ng-template>

@if (locked()) {
  <p class="kind-rack__locked" [attr.data-kind]="kind()">
    <span class="kind-rack__chip">
      <ng-container [ngTemplateOutlet]="glyph" [ngTemplateOutletContext]="{ $implicit: kind() }" />
      {{ selectedLabel() }}
    </span>
    <span class="kind-rack__locked-blurb">{{ selectedBlurb() }}</span>
  </p>
} @else {
  <fieldset class="kind-rack">
    <legend class="kind-rack__legend">What are you making?</legend>
    <div class="kind-rack__options">
      @for (option of options; track option.kind) {
        <label
          class="kind-rack__option"
          [class.kind-rack__option--selected]="kind() === option.kind"
          [attr.data-kind]="option.kind"
        >
          <input
            type="radio"
            class="kind-rack__input"
            [name]="name()"
            [value]="option.kind"
            [checked]="kind() === option.kind"
            (change)="onSelect(option.kind)"
          />
          <ng-container [ngTemplateOutlet]="glyph" [ngTemplateOutletContext]="{ $implicit: option.kind }" />
          <span class="kind-rack__label">{{ option.label }}</span>
          <span class="kind-rack__blurb">{{ option.blurb }}</span>
        </label>
      }
    </div>
  </fieldset>
}
