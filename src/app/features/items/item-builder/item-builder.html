<div class="item-builder">
  <h1 class="item-builder__title">{{ heading() }}</h1>

  @if (loading()) {
    <p class="item-builder__loading">Loading item&hellip;</p>
  } @else if (loadError()) {
    <p class="item-builder__load-error">Something went wrong loading this item.</p>
  } @else {
    <app-item-form
      [initialValue]="initialValue()"
      [lockedKind]="lockedKind()"
      [submitting]="saving()"
      [errorMessage]="saveError()"
      [submitLabel]="submitLabel()"
      [campaignOptions]="campaignOptions()"
      [canSetPublic]="canSetPublic()"
      (submitted)="onSubmitted($event)"
      (cancelled)="onCancelled()"
    />
  }
</div>
