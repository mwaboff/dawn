<app-gm-board-controls
  [filter]="filter()"
  [matchCount]="matchCount()"
  [totalCount]="panels().length"
  (filterChange)="filter.set($event)"
  (expandAll)="setAllCollapsed(false)"
  (collapseAll)="setAllCollapsed(true)"
  (resetLayout)="resetLayout()"
>
  <ng-content select="[gmBoardLead]" ngProjectAs="[gmBoardLead]" />
</app-gm-board-controls>

@for (section of sections(); track section.category) {
  <section class="gm-section" [class.is-filtered-out]="!sectionMatches(section)">
    <header class="gm-section__head">
      <h2 class="gm-section__title">{{ section.category }}</h2>
      <span class="gm-section__rule" aria-hidden="true"></span>
      <button
        type="button"
        class="gm-section__btn"
        [attr.aria-label]="
          (isSectionCollapsed(section) ? 'Expand all ' : 'Collapse all ') + section.category + ' panels'
        "
        (click)="toggleSection(section)"
      >
        {{ isSectionCollapsed(section) ? 'Expand' : 'Collapse' }}
      </button>
    </header>

    <div
      class="gm-grid"
      appMasonryGrid
      [disabled]="isNarrow()"
      cdkDropList
      cdkDropListOrientation="mixed"
      (cdkDropListDropped)="onDrop(section, $event)"
    >
      @for (p of section.panels; track p.id; let i = $index, first = $first, last = $last) {
        <app-gm-panel-card
          appMasonryItem
          cdkDrag
          [cdkDragDisabled]="isFiltering() || isNarrow()"
          [class.is-filtered-out]="!matches(p)"
          [panel]="p"
          [collapsed]="isCollapsed(p)"
          [forceOpen]="isFiltering()"
          [isFirst]="first"
          [isLast]="last"
          (toggled)="toggleCollapsed(p)"
          (moveUp)="moveBy(section, i, -1)"
          (moveDown)="moveBy(section, i, 1)"
          (revealed)="onBeforeMatch(p)"
        />
      }
    </div>
  </section>
}

@if (matchCount() === 0) {
  <p class="gm-board__empty">
    Nothing matches “{{ filter() }}”. Try a rule name, a condition, or a page term like “threshold”.
  </p>
}
