@if (items().length > 0) {
  <div class="also-happening-banner" role="note">
    <span class="also-happening-banner__label">Also happening this level-up:</span>
    <ul class="also-happening-banner__list">
      @for (item of items(); track item) {
        <li>{{ item }}</li>
      }
    </ul>
  </div>
}
