<div class="card-edit">
  <app-card-edit-toolbar
    [hasPendingChanges]="hasPendingChanges()"
    [saving]="saving()"
    [deleting]="deleting()"
    [error]="error()"
    [saveSuccess]="saveSuccess()"
    (save)="onSave()"
    (deleteCard)="onDelete()"
    (back)="onBack()"
  />

  @if (loading()) {
    <div class="card-edit-loading">Loading card data...</div>
  }

  @if (!loading() && rawCard()) {
    <div class="card-edit-content">
      <app-item-form
        [cardType]="cardType()"
        [mode]="'edit'"
        [initialData]="rawCard()"
        [saving]="saving()"
        [submitted]="submitted()"
        [showIsOfficialField]="true"
        [extraFeatures]="previewFeatures()"
        (formChanged)="bumpFormVersion()"
        #itemFormRef
      />

      <app-card-edit-features
        class="features-section"
        [features]="rawFeatures()"
        [saving]="saving()"
        [groupByType]="cardType() === 'class'"
        [cardType]="cardType()"
        [expansionId]="rawCard()?.expansionId ?? 0"
        (featureDirtyChanged)="bumpFormVersion()"
        (deleteFeature)="onDeleteFeature($event)"
        #featuresRef
      />
    </div>
  }
</div>
