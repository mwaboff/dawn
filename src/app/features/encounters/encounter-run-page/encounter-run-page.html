<div class="run-page page-shell page-shell--page">
  <!-- The visible name of the encounter is rendered as an h2 inside the run view, which left this
       document opening at h2 with no h1. Visually hidden rather than shown, because the run view's
       own header is already the page's title and a second one would just be chrome above a fight. -->
  <h1 class="sr-only">Running an encounter</h1>

  @if (loading()) {
    <div class="run-page-loading" role="status" aria-live="polite">
      <p class="run-page-loading-text">Readying the field…</p>
    </div>
  } @else if (error()) {
    <div class="run-page-error">
      <app-card-error />
      <button type="button" class="btn btn--secondary" (click)="retryLoad()">Try Again</button>
    </div>
  } @else if (runId(); as id) {
    <a class="run-page-back" [routerLink]="[encountersListPath]">&larr; Back to Encounters</a>
    <app-encounter-run-view
      [runId]="id"
      [density]="'comfortable'"
      [showHeader]="true"
      [title]="encounterName() ?? 'Running Encounter'"
      [editHref]="editHref() ?? undefined"
      (completed)="onCompleted()"
      (encounterDeleted)="onCompleted()"
    />
  }
</div>
