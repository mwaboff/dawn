<div class="env-picker">
  <div class="env-picker__head">
    <p class="env-picker__note">Environments don't affect Battle Points — this is a scene, not an adversary.</p>
    @if (selectedEnvironmentId() !== undefined) {
      <button type="button" class="env-picker__clear-btn" (click)="onClear()">Clear environment</button>
    }
  </div>
  <div class="env-picker__grid">
    @if (sheetLayout() === 'beta') {
      <!-- Ultra-minimized, expand-on-click rows -- the same app-entity-card size="compact" pattern
           the character sheet's item finder uses (item-finder-result.html). -->
      <app-entity-selection-grid
        [appCardSurface]="'dark-capable'"
        [cards]="environments()"
        [loading]="loading()"
        [error]="error()"
        [selectedCard]="selectedCard()"
        [size]="'compact'"
        [cardMapper]="cardMapper"
        ariaLabel="Choose an environment"
        (cardSelected)="onCardSelected($event)"
      />
    } @else {
      <app-card-selection-grid
        [cards]="environments()"
        [loading]="loading()"
        [error]="error()"
        [selectedCard]="selectedCard()"
        (cardSelected)="onCardSelected($event)"
      />
    }
  </div>
</div>
