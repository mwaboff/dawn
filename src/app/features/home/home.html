@if (!isLoggedIn()) {
  <app-landing-hero />

  <section class="steps" aria-labelledby="landing-steps-title">
    <header class="steps__header">
      <h2 id="landing-steps-title" class="landing-heading">From first roll to final encounter</h2>
      <p class="steps__lede">For players and GMs alike.</p>
    </header>

    <ol class="steps__list">
      @for (step of steps; track step.id; let odd = $odd) {
        <li>
          <app-landing-showcase [step]="step" [reversed]="odd" />
        </li>
      }
    </ol>
  </section>

  <app-landing-features />
  <app-landing-closing />
} @else {
  <app-dashboard />
}
