<section class="hero" aria-labelledby="landing-hero-title">
  <div class="grain-overlay hero__grain" aria-hidden="true"></div>

  <div class="hero__text">
    <p class="landing-eyebrow hero__eyebrow">Your Daggerheart Companion</p>
    <h1 id="landing-hero-title" class="hero__title">
      <span class="hero__line">From First Spark</span>
      <span class="hero__line hero__line--accent">To Final Stand</span>
    </h1>
    <p class="hero__lede">
      Build a hero in minutes, play from a sheet that does the math, and run your campaign from
      the same place.
    </p>
    <app-landing-cta-links class="hero__cta" />
    <p class="hero__fine">Sign in with Google and you&rsquo;re ready to play.</p>
  </div>

  <app-landing-shot class="hero__shot" [shot]="shot" [priority]="true" sizes="(max-width: 1288px) calc(100vw - 3rem), 1240px" />
</section>
