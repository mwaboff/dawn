<div class="showcase__text">
  <p class="landing-eyebrow showcase__eyebrow">
    <span class="showcase__number" aria-hidden="true">{{ index() + 1 }}</span>
    {{ step().eyebrow }}
  </p>
  <h3 class="showcase__title">{{ step().title }}</h3>
  <p class="showcase__body">{{ step().body }}</p>
</div>
<app-landing-shot class="showcase__shot" [shot]="step().shot" />
