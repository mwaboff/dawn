<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Oh Sheet</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    try {
      var prefs = JSON.parse(localStorage.getItem('oh-sheet:preferences'));
      var density = prefs && prefs.density === 'condensed' ? 'condensed' : 'comfortable';
      var motion = prefs && (prefs.motion === 'reduced' || prefs.motion === 'full') ? prefs.motion : 'system';
      var cardTheme = prefs && prefs.cardTheme === 'light' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-density', density);
      document.documentElement.setAttribute('data-motion', motion);
      document.documentElement.setAttribute('data-card-theme', cardTheme);
    } catch (e) {
      document.documentElement.setAttribute('data-density', 'comfortable');
      document.documentElement.setAttribute('data-motion', 'system');
      document.documentElement.setAttribute('data-card-theme', 'dark');
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
